naftiko: 1.0.0-alpha2
info:
  label: WellCare FHIR Provider Directory API — Organization
  description: 'WellCare FHIR Provider Directory API — Organization. 2 operations. Lead operation: Search Organizations. Self-contained
    Naftiko capability covering one Wellcare Health Plans business surface.'
  tags:
  - Wellcare Health Plans
  - Organization
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WELLCARE_HEALTH_PLANS_API_KEY: WELLCARE_HEALTH_PLANS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wellcare-fhir-provider-directory-organization
    baseUri: https://partners.centene.com
    description: WellCare FHIR Provider Directory API — Organization business capability. Self-contained, no shared references.
    resources:
    - name: fhir-r4-Organization
      path: /fhir/r4/Organization
      operations:
      - name: searchorganizations
        method: GET
        description: Search Organizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: name
          in: query
          type: string
          description: Organization name (partial match supported).
        - name: identifier
          in: query
          type: string
          description: NPI or other organization identifier.
        - name: type
          in: query
          type: string
          description: Organization type (e.g., hospital, clinic, pharmacy).
        - name: _count
          in: query
          type: integer
          description: Number of results per page.
    - name: fhir-r4-Organization-id
      path: /fhir/r4/Organization/{id}
      operations:
      - name: getorganization
        method: GET
        description: Get Organization
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: id
          in: path
          type: string
          description: The FHIR Organization resource ID.
          required: true
    authentication:
      type: bearer
      token: '{{env.WELLCARE_HEALTH_PLANS_API_KEY}}'
  exposes:
  - type: rest
    namespace: wellcare-fhir-provider-directory-organization-rest
    port: 8080
    description: REST adapter for WellCare FHIR Provider Directory API — Organization. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/fhir/r4/organization
      name: fhir-r4-organization
      description: REST surface for fhir-r4-Organization.
      operations:
      - method: GET
        name: searchorganizations
        description: Search Organizations
        call: wellcare-fhir-provider-directory-organization.searchorganizations
        with:
          name: rest.name
          identifier: rest.identifier
          type: rest.type
          _count: rest._count
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/fhir/r4/organization/{id}
      name: fhir-r4-organization-id
      description: REST surface for fhir-r4-Organization-id.
      operations:
      - method: GET
        name: getorganization
        description: Get Organization
        call: wellcare-fhir-provider-directory-organization.getorganization
        with:
          id: rest.id
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wellcare-fhir-provider-directory-organization-mcp
    port: 9090
    transport: http
    description: MCP adapter for WellCare FHIR Provider Directory API — Organization. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: search-organizations
      description: Search Organizations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wellcare-fhir-provider-directory-organization.searchorganizations
      with:
        name: tools.name
        identifier: tools.identifier
        type: tools.type
        _count: tools._count
      outputParameters:
      - type: object
        mapping: $.
    - name: get-organization
      description: Get Organization
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wellcare-fhir-provider-directory-organization.getorganization
      with:
        id: tools.id
      outputParameters:
      - type: object
        mapping: $.
