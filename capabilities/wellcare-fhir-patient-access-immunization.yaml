naftiko: 1.0.0-alpha2
info:
  label: WellCare FHIR Patient Access API — Immunization
  description: 'WellCare FHIR Patient Access API — Immunization. 1 operations. Lead operation: List Immunizations. Self-contained
    Naftiko capability covering one Wellcare Health Plans business surface.'
  tags:
  - Wellcare Health Plans
  - Immunization
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WELLCARE_HEALTH_PLANS_API_KEY: WELLCARE_HEALTH_PLANS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wellcare-fhir-patient-access-immunization
    baseUri: https://partners.centene.com
    description: WellCare FHIR Patient Access API — Immunization business capability. Self-contained, no shared references.
    resources:
    - name: fhir-r4-Immunization
      path: /fhir/r4/Immunization
      operations:
      - name: listimmunizations
        method: GET
        description: List Immunizations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          description: The FHIR Patient ID.
          required: true
    authentication:
      type: bearer
      token: '{{env.WELLCARE_HEALTH_PLANS_API_KEY}}'
  exposes:
  - type: rest
    namespace: wellcare-fhir-patient-access-immunization-rest
    port: 8080
    description: REST adapter for WellCare FHIR Patient Access API — Immunization. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/fhir/r4/immunization
      name: fhir-r4-immunization
      description: REST surface for fhir-r4-Immunization.
      operations:
      - method: GET
        name: listimmunizations
        description: List Immunizations
        call: wellcare-fhir-patient-access-immunization.listimmunizations
        with:
          patient: rest.patient
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wellcare-fhir-patient-access-immunization-mcp
    port: 9090
    transport: http
    description: MCP adapter for WellCare FHIR Patient Access API — Immunization. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-immunizations
      description: List Immunizations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wellcare-fhir-patient-access-immunization.listimmunizations
      with:
        patient: tools.patient
      outputParameters:
      - type: object
        mapping: $.
