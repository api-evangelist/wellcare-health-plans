description: >-
  WellCare Health Plans was a managed care company that focused exclusively on government-sponsored managed care
  services through Medicaid, Medicare Advantage, and Medicare Prescription Drug Plans before being acquired by Centene
  Corporation. Now operating under Centene, WellCare provides FHIR- compliant APIs for interoperability and patient
  access as required by CMS Interoperability and Patient Access final rules (CMS-9115-F). The Centene Developer Partner
  Portal at partners.centene.com/apis provides access to WellCare FHIR APIs.
