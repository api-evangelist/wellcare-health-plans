naftiko: "1.0.0-alpha1"

info:
  label: "WellCare FHIR Provider Directory API"
  description: >-
    FHIR R4 provider directory API providing access to in-network practitioners,
    organizations, locations, and insurance plan information for WellCare
    Medicaid and Medicare Advantage plans following the Da Vinci PDex Plan-Net
    implementation guide.
  tags:
    - Healthcare
    - FHIR
    - Provider Directory
    - Managed Care
    - Medicaid
    - Medicare
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WELLCARE_PROVIDER_DIRECTORY_TOKEN: WELLCARE_PROVIDER_DIRECTORY_TOKEN

capability:
  consumes:
    - type: http
      namespace: wellcare-provider-directory
      baseUri: https://partners.centene.com
      description: "WellCare FHIR R4 Provider Directory API."
      authentication:
        type: bearer
        token: "{{WELLCARE_PROVIDER_DIRECTORY_TOKEN}}"
      resources:
        - name: practitioner
          path: /fhir/r4/Practitioner
          description: Individual healthcare practitioners.
          operations:
            - name: search-practitioners
              method: GET
              description: "Search practitioners by name, specialty, or NPI."
              inputParameters:
                - name: name
                  in: query
                  type: string
                  required: false
                  description: "Practitioner name."
                - name: identifier
                  in: query
                  type: string
                  required: false
                  description: "NPI or other identifier."
                - name: specialty
                  in: query
                  type: string
                  required: false
                  description: "Specialty taxonomy code."
                - name: _count
                  in: query
                  type: integer
                  required: false
                  description: "Results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-practitioner
              method: GET
              description: "Get Practitioner by FHIR ID."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "FHIR Practitioner ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: organization
          path: /fhir/r4/Organization
          description: Healthcare organizations and facilities.
          operations:
            - name: search-organizations
              method: GET
              description: "Search organizations by name, type, or NPI."
              inputParameters:
                - name: name
                  in: query
                  type: string
                  required: false
                  description: "Organization name."
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Organization type."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: get-organization
              method: GET
              description: "Get Organization by FHIR ID."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "FHIR Organization ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: location
          path: /fhir/r4/Location
          description: Care delivery locations.
          operations:
            - name: search-locations
              method: GET
              description: "Search locations by ZIP code or proximity."
              inputParameters:
                - name: address-postalcode
                  in: query
                  type: string
                  required: false
                  description: "ZIP code for location search."
                - name: near
                  in: query
                  type: string
                  required: false
                  description: "Proximity coordinate search."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: practitioner-role
          path: /fhir/r4/PractitionerRole
          description: Practitioner network roles and affiliations.
          operations:
            - name: search-practitioner-roles
              method: GET
              description: "Search practitioner roles and network affiliations."
              inputParameters:
                - name: practitioner
                  in: query
                  type: string
                  required: false
                  description: "FHIR Practitioner ID."
                - name: organization
                  in: query
                  type: string
                  required: false
                  description: "FHIR Organization ID."
                - name: specialty
                  in: query
                  type: string
                  required: false
                  description: "Specialty code."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: insurance-plan
          path: /fhir/r4/InsurancePlan
          description: Insurance plan network and benefit details.
          operations:
            - name: search-insurance-plans
              method: GET
              description: "Search insurance plans by name or type."
              inputParameters:
                - name: name
                  in: query
                  type: string
                  required: false
                  description: "Plan name."
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Plan type."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8101
      namespace: wellcare-provider-directory-rest
      resources:
        - path: /v1/providers
          name: providers
          description: "Search in-network providers."
          operations:
            - method: GET
              name: search-providers
              description: "Search practitioners by specialty or name."
              call: "wellcare-provider-directory.search-practitioners"
              with:
                name: "rest.name"
                specialty: "rest.specialty"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/facilities
          name: facilities
          description: "Search healthcare facilities."
          operations:
            - method: GET
              name: search-facilities
              description: "Search organizations by name or type."
              call: "wellcare-provider-directory.search-organizations"
              with:
                name: "rest.name"
                type: "rest.type"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/locations
          name: locations
          description: "Search care locations."
          operations:
            - method: GET
              name: search-locations
              description: "Search locations by ZIP code."
              call: "wellcare-provider-directory.search-locations"
              with:
                address-postalcode: "rest.postalcode"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: wellcare-provider-directory-mcp
      transport: http
      tools:
        - name: search-in-network-providers
          description: "Search for in-network WellCare practitioners by name, specialty, or NPI."
          hints:
            readOnly: true
            openWorld: true
          call: "wellcare-provider-directory.search-practitioners"
          with:
            name: "tools.name"
            specialty: "tools.specialty"
            identifier: "tools.npi"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-provider-details
          description: "Get detailed information for a specific WellCare network provider."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-provider-directory.get-practitioner"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-network-facilities
          description: "Search for in-network hospitals and clinics in the WellCare network."
          hints:
            readOnly: true
            openWorld: true
          call: "wellcare-provider-directory.search-organizations"
          with:
            name: "tools.name"
            type: "tools.type"
          outputParameters:
            - type: object
              mapping: "$."

        - name: find-care-locations
          description: "Find care delivery locations near a ZIP code in the WellCare network."
          hints:
            readOnly: true
            openWorld: true
          call: "wellcare-provider-directory.search-locations"
          with:
            address-postalcode: "tools.postalcode"
          outputParameters:
            - type: object
              mapping: "$."

        - name: search-insurance-plans
          description: "Search WellCare insurance plans by type or name."
          hints:
            readOnly: true
            openWorld: true
          call: "wellcare-provider-directory.search-insurance-plans"
          with:
            name: "tools.name"
            type: "tools.type"
          outputParameters:
            - type: object
              mapping: "$."
