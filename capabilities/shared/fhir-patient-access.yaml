naftiko: "1.0.0-alpha1"

info:
  label: "WellCare FHIR Patient Access API"
  description: >-
    FHIR R4 patient access API enabling members and authorized third-party apps to
    access health data including claims, clinical information, medications, and
    immunizations for WellCare Medicaid and Medicare Advantage members.
  tags:
    - Healthcare
    - FHIR
    - Patient Access
    - Managed Care
    - Medicaid
    - Medicare
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      WELLCARE_PATIENT_ACCESS_TOKEN: WELLCARE_PATIENT_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: wellcare-patient-access
      baseUri: https://partners.centene.com
      description: "WellCare FHIR R4 Patient Access API for member health data."
      authentication:
        type: bearer
        token: "{{WELLCARE_PATIENT_ACCESS_TOKEN}}"
      resources:
        - name: patient
          path: /fhir/r4/Patient
          description: Patient demographic and identity resources.
          operations:
            - name: get-patient
              method: GET
              description: "Get Patient by FHIR ID."
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "FHIR Patient resource ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: coverage
          path: /fhir/r4/Coverage
          description: Member insurance coverage and enrollment.
          operations:
            - name: list-coverage
              method: GET
              description: "List Coverage for a member."
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "FHIR Patient ID."
                - name: _count
                  in: query
                  type: integer
                  required: false
                  description: "Number of results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: explanation-of-benefit
          path: /fhir/r4/ExplanationOfBenefit
          description: Claims and EOB data for medical, pharmacy, dental, and vision.
          operations:
            - name: list-explanation-of-benefit
              method: GET
              description: "List Explanation of Benefit claims for a member."
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "FHIR Patient ID."
                - name: service-date
                  in: query
                  type: string
                  required: false
                  description: "Filter by service date range."
                - name: type
                  in: query
                  type: string
                  required: false
                  description: "Filter by claim type."
                - name: _count
                  in: query
                  type: integer
                  required: false
                  description: "Number of results per page."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: condition
          path: /fhir/r4/Condition
          description: Member diagnosed conditions.
          operations:
            - name: list-conditions
              method: GET
              description: "List Conditions for a member."
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "FHIR Patient ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: observation
          path: /fhir/r4/Observation
          description: Clinical observations and lab results.
          operations:
            - name: list-observations
              method: GET
              description: "List Observations for a member."
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "FHIR Patient ID."
                - name: category
                  in: query
                  type: string
                  required: false
                  description: "Observation category filter."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: medication-request
          path: /fhir/r4/MedicationRequest
          description: Prescribed medications and medication orders.
          operations:
            - name: list-medication-requests
              method: GET
              description: "List Medication Requests for a member."
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "FHIR Patient ID."
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Medication status filter."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: immunization
          path: /fhir/r4/Immunization
          description: Immunization records and history.
          operations:
            - name: list-immunizations
              method: GET
              description: "List Immunizations for a member."
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "FHIR Patient ID."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: encounter
          path: /fhir/r4/Encounter
          description: Care encounters and visits.
          operations:
            - name: list-encounters
              method: GET
              description: "List Encounters for a member."
              inputParameters:
                - name: patient
                  in: query
                  type: string
                  required: true
                  description: "FHIR Patient ID."
                - name: date
                  in: query
                  type: string
                  required: false
                  description: "Encounter date range filter."
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: wellcare-patient-access-rest
      resources:
        - path: /v1/patients/{id}
          name: patient
          description: "Patient demographic information."
          operations:
            - method: GET
              name: get-patient
              description: "Get patient by ID."
              call: "wellcare-patient-access.get-patient"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/coverage
          name: coverage
          description: "Member insurance coverage."
          operations:
            - method: GET
              name: list-coverage
              description: "List coverage for a member."
              call: "wellcare-patient-access.list-coverage"
              with:
                patient: "rest.patient"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/claims
          name: claims
          description: "Member claims and EOB data."
          operations:
            - method: GET
              name: list-claims
              description: "List claims for a member."
              call: "wellcare-patient-access.list-explanation-of-benefit"
              with:
                patient: "rest.patient"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/conditions
          name: conditions
          description: "Member conditions."
          operations:
            - method: GET
              name: list-conditions
              description: "List conditions for a member."
              call: "wellcare-patient-access.list-conditions"
              with:
                patient: "rest.patient"
              outputParameters:
                - type: object
                  mapping: "$."

        - path: /v1/medications
          name: medications
          description: "Member medication requests."
          operations:
            - method: GET
              name: list-medications
              description: "List medication requests for a member."
              call: "wellcare-patient-access.list-medication-requests"
              with:
                patient: "rest.patient"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: wellcare-patient-access-mcp
      transport: http
      tools:
        - name: get-member-profile
          description: "Get WellCare member demographic profile by patient ID."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-patient-access.get-patient"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-member-coverage
          description: "Get insurance coverage details for a WellCare member."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-patient-access.list-coverage"
          with:
            patient: "tools.patient"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-member-claims
          description: "Get claims and EOB data for a WellCare member."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-patient-access.list-explanation-of-benefit"
          with:
            patient: "tools.patient"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-member-conditions
          description: "Get diagnosed conditions for a WellCare member."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-patient-access.list-conditions"
          with:
            patient: "tools.patient"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-member-medications
          description: "Get active medication requests for a WellCare member."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-patient-access.list-medication-requests"
          with:
            patient: "tools.patient"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-member-immunizations
          description: "Get immunization history for a WellCare member."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-patient-access.list-immunizations"
          with:
            patient: "tools.patient"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-member-encounters
          description: "Get care encounters and visits for a WellCare member."
          hints:
            readOnly: true
            openWorld: false
          call: "wellcare-patient-access.list-encounters"
          with:
            patient: "tools.patient"
          outputParameters:
            - type: object
              mapping: "$."
