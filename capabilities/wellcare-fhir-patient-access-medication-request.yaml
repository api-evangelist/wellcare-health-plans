naftiko: 1.0.0-alpha2
info:
  label: WellCare FHIR Patient Access API — Medication Request
  description: 'WellCare FHIR Patient Access API — Medication Request. 1 operations. Lead operation: List Medication Requests.
    Self-contained Naftiko capability covering one Wellcare Health Plans business surface.'
  tags:
  - Wellcare Health Plans
  - Medication Request
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WELLCARE_HEALTH_PLANS_API_KEY: WELLCARE_HEALTH_PLANS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wellcare-fhir-patient-access-medication-request
    baseUri: https://partners.centene.com
    description: WellCare FHIR Patient Access API — Medication Request business capability. Self-contained, no shared references.
    resources:
    - name: fhir-r4-MedicationRequest
      path: /fhir/r4/MedicationRequest
      operations:
      - name: listmedicationrequests
        method: GET
        description: List Medication Requests
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: patient
          in: query
          type: string
          description: The FHIR Patient ID.
          required: true
        - name: status
          in: query
          type: string
          description: Filter by medication request status (active, completed, stopped).
    authentication:
      type: bearer
      token: '{{env.WELLCARE_HEALTH_PLANS_API_KEY}}'
  exposes:
  - type: rest
    namespace: wellcare-fhir-patient-access-medication-request-rest
    port: 8080
    description: REST adapter for WellCare FHIR Patient Access API — Medication Request. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/fhir/r4/medicationrequest
      name: fhir-r4-medicationrequest
      description: REST surface for fhir-r4-MedicationRequest.
      operations:
      - method: GET
        name: listmedicationrequests
        description: List Medication Requests
        call: wellcare-fhir-patient-access-medication-request.listmedicationrequests
        with:
          patient: rest.patient
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wellcare-fhir-patient-access-medication-request-mcp
    port: 9090
    transport: http
    description: MCP adapter for WellCare FHIR Patient Access API — Medication Request. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-medication-requests
      description: List Medication Requests
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wellcare-fhir-patient-access-medication-request.listmedicationrequests
      with:
        patient: tools.patient
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
