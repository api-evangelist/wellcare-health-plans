naftiko: 1.0.0-alpha2
info:
  label: WellCare FHIR Provider Directory API — Practitioner Role
  description: 'WellCare FHIR Provider Directory API — Practitioner Role. 1 operations. Lead operation: Search Practitioner
    Roles. Self-contained Naftiko capability covering one Wellcare Health Plans business surface.'
  tags:
  - Wellcare Health Plans
  - Practitioner Role
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    WELLCARE_HEALTH_PLANS_API_KEY: WELLCARE_HEALTH_PLANS_API_KEY
capability:
  consumes:
  - type: http
    namespace: wellcare-fhir-provider-directory-practitioner-role
    baseUri: https://partners.centene.com
    description: WellCare FHIR Provider Directory API — Practitioner Role business capability. Self-contained, no shared references.
    resources:
    - name: fhir-r4-PractitionerRole
      path: /fhir/r4/PractitionerRole
      operations:
      - name: searchpractitionerroles
        method: GET
        description: Search Practitioner Roles
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: practitioner
          in: query
          type: string
          description: FHIR Practitioner ID.
        - name: organization
          in: query
          type: string
          description: FHIR Organization ID.
        - name: specialty
          in: query
          type: string
          description: Specialty taxonomy code.
        - name: location
          in: query
          type: string
          description: FHIR Location ID.
    authentication:
      type: bearer
      token: '{{env.WELLCARE_HEALTH_PLANS_API_KEY}}'
  exposes:
  - type: rest
    namespace: wellcare-fhir-provider-directory-practitioner-role-rest
    port: 8080
    description: REST adapter for WellCare FHIR Provider Directory API — Practitioner Role. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/fhir/r4/practitionerrole
      name: fhir-r4-practitionerrole
      description: REST surface for fhir-r4-PractitionerRole.
      operations:
      - method: GET
        name: searchpractitionerroles
        description: Search Practitioner Roles
        call: wellcare-fhir-provider-directory-practitioner-role.searchpractitionerroles
        with:
          practitioner: rest.practitioner
          organization: rest.organization
          specialty: rest.specialty
          location: rest.location
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: wellcare-fhir-provider-directory-practitioner-role-mcp
    port: 9090
    transport: http
    description: MCP adapter for WellCare FHIR Provider Directory API — Practitioner Role. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: search-practitioner-roles
      description: Search Practitioner Roles
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: wellcare-fhir-provider-directory-practitioner-role.searchpractitionerroles
      with:
        practitioner: tools.practitioner
        organization: tools.organization
        specialty: tools.specialty
        location: tools.location
      outputParameters:
      - type: object
        mapping: $.
